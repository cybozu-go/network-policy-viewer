name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: The name of the tag to release (X.Y.Z)
permissions:
  contents: write
  packages: write
jobs:
  release:
    name: Release network-policy-viewer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # Fetch all tags to check whether the release tag already exists.
          persist-credentials: true
      - name: Validate inputs
        env:
          VTAG: v${{ inputs.tag }}
        run: |
          if [[ ! "${VTAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format. Please use X.Y.Z"
            exit 1
          fi
          if git rev-parse "${VTAG}" >/dev/null 2>&1; then
              echo "Tag ${VTAG} already exists"
              exit 1
          fi
      - name: Download Cilium CLI
        run: make download-cilium-cli
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push cilium-agent-proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/cybozu-go/cilium-agent-proxy:${{ inputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Disable caching to prevent cache poisoning in the release workflow.
          cache: false
      - name: Build
        env:
          VTAG: v${{ inputs.tag }}
        run: |
          make build
          cd bin; tar -czvf "npv_${VTAG}_amd64.tar.gz" npv
      - name: Setup Git Config
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
      - name: Push tag
        env:
          VTAG: v${{ inputs.tag }}
        run: |
          git tag -a "${VTAG}" -m "Release network-policy-viewer ${VTAG}"
          git push origin "${VTAG}"
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VTAG: v${{ inputs.tag }}
        run: |
          gh release create "${VTAG}" --title "Release ${VTAG}" --generate-notes
          gh release upload "${VTAG}" "bin/npv_${VTAG}_amd64.tar.gz" --clobber
