name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: read
jobs:
  test:
    name: e2e
    runs-on:
      group: network-policy-viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/download
          key: cache-tools-go-${{ hashFiles('go.mod') }}-${{ hashFiles('Makefile') }}
      - name: Cache files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: cache-files-go-${{ hashFiles('go.mod') }}-${{ hashFiles('Makefile') }}
      - uses: ./.github/actions/aqua
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup tools
        run: make setup download-cilium-cli
      - name: Run code check
        run: make check-generate
      - name: Run lint
        run: make lint
      - name: Run lint-actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make lint-actions
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cilium-agent-proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: cilium-agent-proxy:dev
      - name: Run environment
        working-directory: e2e
        run: |
          make start
          make install-test-pod
          make install-policy-viewer
      - name: Test
        working-directory: e2e
        run: make test
