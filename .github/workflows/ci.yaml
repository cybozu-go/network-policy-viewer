name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    name: e2e
    runs-on:
      group: network-policy-viewer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/download
          key: cache-tools-go-${{ hashFiles('go.mod') }}-${{ hashFiles('Makefile') }}
      - name: Cache files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: cache-files-go-${{ hashFiles('go.mod') }}-${{ hashFiles('Makefile') }}
      - uses: ./.github/actions/aqua
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup tools
        run: make setup download-cilium-cli
      - name: Run code check
        run: make check-generate
      - name: Run lint
        run: make lint
      - name: Run lint-actions
        run: make lint-actions
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cilium-agent-proxy
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: cilium-agent-proxy:dev
      - name: Run environment
        working-directory: e2e
        run: |
          make start
          make install-test-pod
          make install-policy-viewer
      - name: Test
        working-directory: e2e
        run: make test
